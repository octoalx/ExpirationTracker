name: Engineering tooling
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tooling:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check instruction budget and documentation
        run: npm run check:context
      - name: Test verification tooling
        run: npm run test:harness
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # Required by the postinstall `prisma generate`; no database is opened here.
          DATABASE_URL: file:./ci-placeholder.db
      - name: Type check
        run: npm run typecheck
      - name: Application tests
        run: npm run test:app
      - name: Production build
        # Type checking and unit tests do NOT exercise webpack's module resolution,
        # so a server-only native dependency imported into a bundle that is also
        # compiled for the edge runtime passes everything above and then fails in
        # the deploy build. That is exactly how the "Can't resolve 'fs'" failure
        # reached production on 2026-10-14. Building here moves that discovery from
        # a deploy to a pull request.
        run: npm run build
        env:
          # The build must not open a database or start background jobs.
          DATABASE_URL: file:./ci-placeholder.db
          DISABLE_BACKGROUND_JOBS: "true"
          NEXT_TELEMETRY_DISABLED: "1"
